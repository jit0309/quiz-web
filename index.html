<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python 퀴즈</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #fff;
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 620px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.3);
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .question-number {
      font-size: 14px;
      color: #999;
      font-weight: 600;
    }

    .score-badge {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
    }

    /* Progress */
    .progress-container {
      background: #f0f0f0;
      border-radius: 10px;
      height: 8px;
      margin-bottom: 32px;
      overflow: hidden;
    }

    .progress-bar {
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100%;
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    /* Question */
    .question {
      font-size: 20px;
      font-weight: 700;
      color: #222;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Options */
    .options {
      display: grid;
      gap: 12px;
    }

    .option-btn {
      padding: 16px 20px;
      border: 2px solid #e8e8e8;
      border-radius: 14px;
      background: #fafafa;
      font-size: 16px;
      color: #333;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: #764ba2;
      background: #f5f0ff;
      transform: translateY(-2px);
    }

    .option-btn.correct {
      border-color: #43a047;
      background: #e8f5e9;
      color: #2e7d32;
      font-weight: 700;
    }

    .option-btn.wrong {
      border-color: #e53935;
      background: #ffebee;
      color: #c62828;
      font-weight: 700;
    }

    .option-btn:disabled { cursor: default; transform: none; }

    /* Feedback */
    .feedback {
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
      font-weight: 700;
      min-height: 28px;
      transition: opacity 0.3s;
    }

    .feedback.correct { color: #43a047; }
    .feedback.wrong   { color: #e53935; }

    /* Next button */
    .next-btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .next-btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .next-btn[hidden] { display: none; }

    /* Result screen */
    .result-screen {
      display: none;
      text-align: center;
    }

    .result-screen.active { display: block; }
    .quiz-screen.hidden   { display: none; }

    .result-emoji { font-size: 72px; margin-bottom: 16px; }

    .result-title {
      font-size: 26px;
      font-weight: 800;
      color: #222;
      margin-bottom: 8px;
    }

    .result-score {
      font-size: 52px;
      font-weight: 900;
      color: #764ba2;
      margin: 16px 0 8px;
    }

    .result-sub {
      color: #777;
      font-size: 16px;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .restart-btn {
      padding: 16px 44px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .restart-btn:hover { opacity: 0.9; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="container">

    <!-- 퀴즈 화면 -->
    <div class="quiz-screen" id="quizScreen">
      <div class="header">
        <span class="question-number" id="questionNumber">문제 1 / 5</span>
        <span class="score-badge" id="scoreDisplay">점수: 0</span>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar" style="width:0%"></div>
      </div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" hidden onclick="nextQuestion()">다음 문제 →</button>
    </div>

    <!-- 결과 화면 -->
    <div class="result-screen" id="resultScreen">
      <div class="result-emoji" id="resultEmoji"></div>
      <div class="result-title">퀴즈 완료!</div>
      <div class="result-score" id="finalScore"></div>
      <div class="result-sub" id="resultSub"></div>
      <button class="restart-btn" onclick="startQuiz()">다시 풀기 🔄</button>
    </div>

  </div>
  <script>
const allQuestions = [
  { question: "Python에서 리스트의 길이를 구하는 함수는?", options: ["len()", "size()", "count()", "length()"], answer: 0 },
  { question: "Python에서 함수를 정의하는 키워드는?", options: ["func", "function", "def", "define"], answer: 2 },
  { question: "Python에서 클래스를 정의하는 키워드는?", options: ["object", "class", "struct", "type"], answer: 1 },
  { question: "Python 리스트에서 마지막 요소를 제거하고 반환하는 메서드는?", options: ["remove()", "pop()", "delete()", "discard()"], answer: 1 },
  { question: "Python에서 딕셔너리의 모든 키를 반환하는 메서드는?", options: ["values()", "items()", "keys()", "get()"], answer: 2 },
  { question: "Python에서 문자열을 대문자로 변환하는 메서드는?", options: ["toUpper()", "uppercase()", "capitalize()", "upper()"], answer: 3 },
  { question: "Python에서 range(5)가 생성하는 숫자 범위는?", options: ["1 ~ 5", "0 ~ 5", "0 ~ 4", "1 ~ 4"], answer: 2 },
  { question: "Python에서 None 여부를 확인하는 올바른 방법은?", options: ["x == None", "x === None", "x is None", "isNone(x)"], answer: 2 },
  { question: "Python에서 리스트를 제자리 오름차순 정렬하는 메서드는?", options: ["order()", "arrange()", "sort()", "sorted()"], answer: 2 },
  { question: "Python에서 print()의 줄바꿈 문자를 바꾸는 매개변수는?", options: ["sep", "end", "newline", "flush"], answer: 1 },
  { question: "Python에서 올바른 리스트 컴프리헨션 문법은?", options: ["[for x in range(5): x*2]", "{x*2 for x in range(5)}", "[x*2 for x in range(5)]", "(x*2 for x in range(5))"], answer: 2 },
  { question: "Python에서 예외 처리 블록의 올바른 순서는?", options: ["catch - try - finally", "try - except - finally", "try - catch - finally", "error - handle - end"], answer: 1 },
  { question: "Python에서 딕셔너리를 만드는 올바른 방법은?", options: ["d = []", "d = ()", "d = {}", "d = <>"], answer: 2 },
  { question: "Python에서 문자열을 분리하는 메서드는?", options: ["divide()", "split()", "cut()", "slice()"], answer: 1 },
  { question: "Python에서 파일을 열 때 사용하는 내장 함수는?", options: ["read()", "load()", "open()", "file()"], answer: 2 }
];

const QUESTIONS_PER_ROUND = 5;
let questions = [], current = 0, score = 0, answered = false;

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function startQuiz() {
  questions = shuffle(allQuestions).slice(0, QUESTIONS_PER_ROUND);
  current = 0; score = 0; answered = false;
  document.getElementById('quizScreen').classList.remove('hidden');
  document.getElementById('resultScreen').classList.remove('active');
  document.getElementById('nextBtn').hidden = true;
  showQuestion();
}

function showQuestion() {
  const q = questions[current];
  answered = false;
  document.getElementById('questionNumber').textContent = `문제 ${current + 1} / ${QUESTIONS_PER_ROUND}`;
  document.getElementById('scoreDisplay').textContent = `점수: ${score}`;
  document.getElementById('progressBar').style.width = `${(current / QUESTIONS_PER_ROUND) * 100}%`;
  document.getElementById('question').textContent = q.question;

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    optionsEl.appendChild(btn);
  });

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').hidden = true;
}

function selectAnswer(index) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll('.option-btn');
  const feedback = document.getElementById('feedback');
  buttons.forEach(btn => btn.disabled = true);

  if (index === q.answer) {
    buttons[index].classList.add('correct');
    feedback.textContent = '✅ 정답입니다!';
    feedback.className = 'feedback correct';
    score++;
  } else {
    buttons[index].classList.add('wrong');
    buttons[q.answer].classList.add('correct');
    feedback.textContent = `❌ 오답! 정답: ${q.options[q.answer]}`;
    feedback.className = 'feedback wrong';
  }
  document.getElementById('scoreDisplay').textContent = `점수: ${score}`;
  document.getElementById('nextBtn').hidden = false;
}

function nextQuestion() {
  current++;
  if (current < QUESTIONS_PER_ROUND) { showQuestion(); } else { showResult(); }
}

function showResult() {
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('active');
  const percent = (score / QUESTIONS_PER_ROUND) * 100;
  let emoji, comment;
  if (percent === 100)     { emoji = '🏆'; comment = '완벽합니다! 만점이에요!'; }
  else if (percent >= 80)  { emoji = '😄'; comment = '훌륭해요! 거의 다 맞혔어요!'; }
  else if (percent >= 60)  { emoji = '🙂'; comment = '좋아요! 조금만 더 공부하면 완벽!'; }
  else if (percent >= 40)  { emoji = '😅'; comment = '아쉽네요. 다시 한번 도전해보세요!'; }
  else                     { emoji = '😢'; comment = '힘내세요! 연습하면 반드시 늘어요!'; }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('finalScore').textContent = `${score} / ${QUESTIONS_PER_ROUND}`;
  document.getElementById('resultSub').innerHTML = `${comment}<br><br>정답률: <strong>${percent}%</strong>`;
  document.getElementById('progressBar').style.width = '100%';
}

startQuiz();
  </script>
</body>
</html>
